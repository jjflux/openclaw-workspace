<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSL Draft</title>
<!-- Hidden / unlisted: not linked anywhere, kept out of search engines -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#0d0e12;color:#FAF8F4;font-family:system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100%;}
  .wrap{max-width:520px;margin:0 auto;padding:32px 20px 48px;}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:28px;letter-spacing:.02em;text-transform:uppercase;text-align:center;margin-bottom:22px;}
  .stage{
    position:relative;width:100%;aspect-ratio:9/16;
    background:#000;border:1px solid #26272e;border-radius:20px;overflow:hidden;
    box-shadow:0 30px 80px -24px rgba(0,0,0,.8), 0 0 0 6px rgba(240,165,0,.05);
  }
  .stage video{width:100%;height:100%;object-fit:contain;display:block;background:#000;}
  .runtime{text-align:center;margin-top:18px;font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#6b6f7a;}
</style>
</head>
<body>
<div class="wrap">
  <h1>VSL Draft</h1>
  <div class="stage">
    <video controls preload="metadata" playsinline controlslist="nodownload">
      <source src="vsl/elias-vsl.mp4" type="video/mp4">
      Your browser can't play this video.
    </video>
  </div>
  <div class="runtime">Runtime · 5:20</div>
</div>
</body>
</html>
